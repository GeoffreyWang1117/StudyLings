# Traditional Important Algorithms - Exercise Information

# Category 1: Garbage Collection and Memory Management
[[exercises]]
name = "gc01_reference_counting"
path = "exercises/01_gc_and_memory/gc01_reference_counting.rs"
mode = "test"
hint = """
Reference counting tracks the number of references to an object.
When the count reaches zero, the object can be freed.
Don't forget to handle cycles!"""

[[exercises]]
name = "gc02_mark_sweep"
path = "exercises/01_gc_and_memory/gc02_mark_sweep.rs"
mode = "test"
hint = """
Mark-Sweep has two phases:
1. Mark: traverse from roots and mark all reachable objects
2. Sweep: free all unmarked objects"""

[[exercises]]
name = "gc03_copying_gc"
path = "exercises/01_gc_and_memory/gc03_copying_gc.rs"
mode = "test"
hint = """
Copying GC divides memory into two spaces.
Copy live objects from 'from-space' to 'to-space', then swap."""

[[exercises]]
name = "gc04_generational_gc"
path = "exercises/01_gc_and_memory/gc04_generational_gc.rs"
mode = "test"
hint = """
Most objects die young. Separate objects into generations
and collect younger generations more frequently."""

[[exercises]]
name = "gc05_tricolor_marking"
path = "exercises/01_gc_and_memory/gc05_tricolor_marking.rs"
mode = "test"
hint = """
Three colors: White (unvisited), Gray (visited but not scanned),
Black (visited and scanned). This enables incremental collection."""

[[exercises]]
name = "gc06_incremental_gc"
path = "exercises/01_gc_and_memory/gc06_incremental_gc.rs"
mode = "test"
hint = """
Break up GC work into small increments to avoid long pauses.
Use tricolor marking to track progress."""

[[exercises]]
name = "gc07_concurrent_gc"
path = "exercises/01_gc_and_memory/gc07_concurrent_gc.rs"
mode = "test"
hint = """
Run GC concurrently with the mutator (application).
Use write barriers to maintain consistency."""

[[exercises]]
name = "gc08_write_barrier"
path = "exercises/01_gc_and_memory/gc08_write_barrier.rs"
mode = "test"
hint = """
Write barriers intercept pointer writes to maintain GC invariants
during concurrent or incremental collection."""

[[exercises]]
name = "gc09_region_allocation"
path = "exercises/01_gc_and_memory/gc09_region_allocation.rs"
mode = "test"
hint = """
Allocate objects in regions/arenas. Free entire regions at once.
Good for phase-based allocation patterns."""

[[exercises]]
name = "gc10_escape_analysis"
path = "exercises/01_gc_and_memory/gc10_escape_analysis.rs"
mode = "test"
hint = """
Analyze whether objects escape their allocation context.
Non-escaping objects can be stack-allocated."""

