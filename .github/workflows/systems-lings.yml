name: Unixlings / Netlings self-check

on:
  push:
    paths: ["Unixlings/**", "Netlings/**", "studylings/**", ".github/workflows/systems-lings.yml"]
  pull_request:
    paths: ["Unixlings/**", "Netlings/**", "studylings/**", ".github/workflows/systems-lings.yml"]

jobs:
  selfcheck:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [Unixlings, Netlings]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build strace clang iproute2 ethtool \
            liburing-dev libbpf-dev libibverbs-dev librdmacm-dev
          sudo modprobe sch_netem || true
          # GitHub runners ship high ASLR entropy, which older TSan runtimes reject
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo pip install -e . || sudo pip install --break-system-packages -e .
      - name: Every solution passes, every untouched exercise fails
        # root: Netlings N09+ build network namespaces and load BPF programs (hardware chapters skip)
        run: sudo -E env "PATH=$PATH" python -m studylings.selfcheck ${{ matrix.project }} -j 2
