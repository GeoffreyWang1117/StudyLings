# Quantum Rustlings - 量子编程学习路径
# 从入门到前沿的量子计算练习题

[[exercises]]
name = "intro01_qubit"
path = "exercises/intro/01_qubit.py"
mode = "test"
hint = """
量子比特是量子计算的基本单位。在经典计算中，比特只能是0或1，
但量子比特可以处于 |0⟩ 和 |1⟩ 的叠加态。

尝试创建一个单量子比特电路，并将其初始化为 |0⟩ 态。
使用 QuantumCircuit(1) 创建一个包含1个量子比特的电路。
"""

[[exercises]]
name = "intro02_superposition"
path = "exercises/intro/02_superposition.py"
mode = "test"
hint = """
Hadamard 门（H门）可以将 |0⟩ 态转换为叠加态：
H|0⟩ = (|0⟩ + |1⟩)/√2

这意味着测量时有50%概率得到0，50%概率得到1。
使用 qc.h(0) 对第0个量子比特应用 Hadamard 门。
"""

[[exercises]]
name = "intro03_measurement"
path = "exercises/intro/03_measurement.py"
mode = "test"
hint = """
测量会使量子态坍缩到经典态。
使用 qc.measure_all() 测量所有量子比特。
使用模拟器运行电路并获取测量结果。
"""

[[exercises]]
name = "intro04_gates"
path = "exercises/intro/04_gates.py"
mode = "test"
hint = """
基本量子门：
- X 门：量子 NOT 门，翻转 |0⟩ ↔ |1⟩
- Y 门：绕 Y 轴旋转
- Z 门：相位翻转
- H 门：创建叠加态

尝试使用这些门来操控量子比特。
"""

