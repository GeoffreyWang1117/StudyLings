[[exercises]]
name = "advanced31_vqls"
path = "exercises/advanced/31_vqls.py"
mode = "test"
hint = """
VQLS (Variational Quantum Linear Solver) 是HHL算法的NISQ友好版本。
通过变分优化求解线性方程组 Ax = b。

关键思想：
- 最小化 ||A|ψ(θ)⟩ - |b⟩||²
- 不需要相位估计（浅电路）
- 适合当前量子设备

2023-2024年的研究热点，有实际应用前景。
"""

[[exercises]]
name = "advanced32_adapt_vqe"
path = "exercises/advanced/32_adapt_vqe.py"
mode = "test"
hint = """
ADAPT-VQE 动态构建最优的ansatz。

优势：
- 避免贫瘠高原问题
- 只添加必要的算符
- 电路深度自适应

算法流程：
1. 计算梯度选择算符
2. 添加到电路
3. 优化参数
4. 重复直到收敛

Grimsley et al. 2019年提出，2023-2024持续改进。
"""

[[exercises]]
name = "advanced33_error_mitigation"
path = "exercises/advanced/33_error_mitigation.py"
mode = "test"
hint = """
量子误差缓解是NISQ时代的关键技术。

主要方法：
- Zero-Noise Extrapolation (ZNE)
- Probabilistic Error Cancellation (PEC)
- Measurement Error Mitigation
- Clifford Data Regression (2023新)

不需要额外量子比特，通过后处理减少误差影响。
2023-2024年快速发展，有多种新技术。
"""

[[exercises]]
name = "advanced34_quantum_natural_gradient"
