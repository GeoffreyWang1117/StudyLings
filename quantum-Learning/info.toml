name = "entanglement05_bell_state"
path = "exercises/entanglement/05_bell_state.py"
mode = "test"
hint = """
贝尔态是最简单的纠缠态：
|Φ+⟩ = (|00⟩ + |11⟩)/√2

创建步骤：
1. 对第一个量子比特应用 H 门
2. 使用 CNOT 门连接两个量子比特：qc.cx(0, 1)
"""

