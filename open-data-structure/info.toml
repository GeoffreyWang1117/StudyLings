# Advanced Data Structures Section
[[exercises]]
name = "trie01"
path = "exercises/10_advanced_structures/01_trie.py"
mode = "test"
hint = """
A Trie stores strings efficiently for prefix-based operations.
Each node represents a character, and edges form words.
Perfect for autocomplete and dictionary operations.
"""

[[exercises]]
name = "unionfind01"
path = "exercises/10_advanced_structures/02_union_find.py"
mode = "test"
hint = """
Union-Find tracks disjoint sets with path compression and union by rank.
Essential for Kruskal's MST and cycle detection.
Amortized O(α(n)) operations where α is inverse Ackermann.
"""

[[exercises]]
name = "segtree01"
path = "exercises/10_advanced_structures/03_segment_tree.py"
mode = "test"
hint = """
Segment Tree enables efficient range queries and updates.
Build the tree recursively, storing aggregates at each node.
O(log n) query and update, O(n) space.
"""

[[exercises]]
name = "fenwick01"
path = "exercises/10_advanced_structures/04_fenwick_tree.py"
mode = "test"
hint = """
Fenwick Tree (BIT) efficiently computes prefix sums.
Use bit operations: i & -i gives lowest set bit.
More space-efficient than Segment Tree for simple operations.
"""

[[exercises]]
name = "bloom01"
path = "exercises/10_advanced_structures/05_bloom_filter.py"
mode = "test"
hint = """
Bloom Filter is a probabilistic set membership structure.
False positives possible, but NO false negatives.
Use k hash functions for optimal space/accuracy tradeoff.
"""

[[exercises]]
name = "kmp01"
path = "exercises/10_advanced_structures/06_kmp_algorithm.py"
mode = "test"
hint = """
KMP algorithm finds pattern in text in O(n+m) time.
Build the LPS (Longest Proper Prefix Suffix) array first.
Use it to skip unnecessary comparisons during matching.
"""

[[exercises]]
name = "interval01"
path = "exercises/10_advanced_structures/07_interval_tree.py"
mode = "test"
hint = """
Interval Tree efficiently finds overlapping intervals.
Store max endpoint in each node to prune searches.
Perfect for scheduling and calendar conflict detection.
"""

[[exercises]]
name = "splay01"
path = "exercises/10_advanced_structures/08_splay_tree.py"
mode = "test"
hint = """
Splay Tree is self-adjusting: accessed nodes move to root.
Use zig, zig-zig, and zig-zag rotations.
Amortized O(log n) with excellent cache performance.
"""

