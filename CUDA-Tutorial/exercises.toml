# ===== 08. Control Flow =====

[[exercises]]
name = "control01_cond"
path = "exercises/08_control_flow/control01_cond.py"
mode = "test"
hint = """
Use lax.cond for conditional operations in JIT-compiled code.
Regular Python if/else doesn't work well with JIT!
Both branches must return same shape/dtype.
"""

[[exercises]]
name = "control02_scan"
path = "exercises/08_control_flow/control02_scan.py"
mode = "test"
hint = """
lax.scan is JAX's efficient loop construct.
Use it for RNNs, cumulative operations, and sequential processing.
Much faster than Python for loops in JIT code!
"""

