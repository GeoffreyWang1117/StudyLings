# JAXlings Exercise Configuration
# This file defines all exercises and their order

[[exercises]]
name = "intro01_hello_jax"
path = "exercises/01_intro/intro01_hello_jax.py"
mode = "test"
hint = """
JAX is a library for high-performance numerical computing.
Start by importing JAX and creating a simple array.
Use jax.numpy (jnp) instead of regular numpy!
"""

[[exercises]]
name = "intro02_arrays"
path = "exercises/01_intro/intro02_arrays.py"
mode = "test"
hint = """
JAX arrays are similar to NumPy arrays but are immutable.
Learn to create and manipulate JAX arrays.
"""

[[exercises]]
name = "intro03_operations"
path = "exercises/01_intro/intro03_operations.py"
mode = "test"
hint = """
JAX provides all standard array operations.
Remember: JAX arrays are immutable, so operations return new arrays.
"""

